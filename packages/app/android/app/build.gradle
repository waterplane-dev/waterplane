apply plugin: 'com.android.application'

// ── Two distributions, two signing keys, one codebase ────────────────────
//
// `dev`  — the owner's own dogfood build (`dev.waterplane.app.dev`): self-update
//          of the shell APK, quiet updates of other apps. Signed with the
//          owner's keystore from `keystore-dev.properties` when that file is
//          there (else from DEV_STORE_FILE & co. in the environment, e.g.
//          under `wp-secret exec`), else with the debug key so a fresh
//          checkout still builds.
// `play` — the Google Play build (`dev.waterplane.app`, permanent once
//          uploaded): never installs itself, never installs anything quietly.
//          A RELEASE of it is signed with the Play UPLOAD key and refuses to
//          build without one; a debug build of it uses the debug key.
//
// Both properties files and every keystore are gitignored (../.gitignore).
// The page learns which one it runs in by asking the shell
// (`ShellInstall.status().distribution`), never at build time: the web bundle
// is shared and updates over the air.

/** storeFile/storePassword/keyAlias/keyPassword from a properties file next to
 *  the root project, or null when the file is absent. A relative storeFile
 *  resolves against packages/app/android, where the properties file lives. */
def keystoreFrom = { String name ->
    def f = rootProject.file(name)
    if (!f.isFile()) return null
    def p = new Properties()
    f.withInputStream { p.load(it) }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !p.getProperty(it) }
    if (missing) throw new GradleException("${name} is missing ${missing.join(', ')} — see packages/app/README.md, Build")
    return [storeFile: rootProject.file(p.getProperty('storeFile')), storePassword: p.getProperty('storePassword'),
            keyAlias: p.getProperty('keyAlias'), keyPassword: p.getProperty('keyPassword')]
}

/** A signing key: the properties file `file` first, else four Gradle properties
 *  (`-P<prop>StoreFile=…`, or ORG_GRADLE_PROJECT_<prop>StoreFile in the
 *  environment), else the plain env names <ENV>_STORE_FILE, <ENV>_STORE_PASSWORD,
 *  <ENV>_KEY_ALIAS, <ENV>_KEY_PASSWORD. The env path is what
 *  `wp-secret exec --as-file <ENV>_STORE_FILE=<id> --as-tmpfile --secret <ENV>_STORE_PASSWORD=<id> …`
 *  fills (packages/app/README.md, Build). A message names a MISSING field, never
 *  a value — no password is ever printed. */
def signingKey = { String what, String file, String prop, String env ->
    def fromFile = keystoreFrom(file)
    if (fromFile) return fromFile
    def read = { String suffix, String envSuffix -> (project.findProperty(prop + suffix) ?: System.getenv(env + envSuffix)) as String }
    def store = read('StoreFile', '_STORE_FILE')
    if (!store) return null
    def k = [storeFile: rootProject.file(store),
             storePassword: read('StorePassword', '_STORE_PASSWORD'),
             keyAlias: read('KeyAlias', '_KEY_ALIAS'),
             keyPassword: read('KeyPassword', '_KEY_PASSWORD')]
    def missing = k.findAll { key, v -> !v }.keySet()
    if (missing) throw new GradleException("${what}: a store file is set but ${missing.join(', ')} is not — see packages/app/README.md, Build")
    // Gradle opens the keystore more than once: a regular file, never a FIFO (`wp-secret exec --as-file`).
    if (!k.storeFile.isFile()) throw new GradleException("${what}: the store file ${store} is not a regular file that exists (wp-secret: add --as-tmpfile to --as-file, a FIFO will not do; its file lives only while its command runs) — see packages/app/README.md, Build")
    return k
}

// The owner's dev key: keystore-dev.properties, else devStoreFile… / DEV_STORE_FILE….
def devKey = signingKey('Dev key', 'keystore-dev.properties', 'dev', 'DEV')
// The Play upload key: keystore-play.properties, else playUploadStoreFile… / PLAY_UPLOAD_STORE_FILE….
def playKey = signingKey('Play upload key', 'keystore-play.properties', 'playUpload', 'PLAY_UPLOAD')

// Which build is this (`@waterplane/shared` buildstamp.ts): version + commit + build time, "+ edits"
// when built dirty. Taken once per configuration, so the APK's BuildConfig (what `ShellUpdate.info()`
// reports to the app-update screen), its `assets/buildstamp.json` (what `release:build` reads out of
// an --apk file) and build/generated/buildstamp/buildstamp.json (what scripts/build-record.mjs
// records) all carry the SAME identity. `dirty` covers every tree the APK is built from, the web
// bundle inside it included; a git that cannot answer leaves the field out, never claims clean.
def repoGit = { List<String> a ->
    try {
        def p = (['git', '-C', rootProject.projectDir.path] + a).execute()
        def out = p.text.trim()
        return p.waitFor() == 0 ? out : null
    } catch (ignored) { return null }
}
def shellVersionCode = (project.findProperty('versionCode') ?: '2') as int
def shellVersionName = (project.findProperty('versionName') ?: '1.0') as String
def repoTop = repoGit(['rev-parse', '--show-toplevel'])
def treeStatus = repoTop ? repoGit(['-C', repoTop, 'status', '--porcelain', '--',
        'packages/app', 'packages/web', 'packages/shared/src', 'packages/extensions']) : null
def shellStamp = [version: "${shellVersionName} (${shellVersionCode})".toString(),
                  sha: repoGit(['rev-parse', '--short', 'HEAD']) ?: null,
                  dirty: treeStatus ? true : null,
                  at: System.currentTimeMillis()].findAll { k, v -> v != null }
def stampDir = layout.buildDirectory.dir('generated/buildstamp').get().asFile
stampDir.mkdirs()
new File(stampDir, 'buildstamp.json').text = groovy.json.JsonOutput.toJson(shellStamp) + "\n"

android {
    namespace = "dev.waterplane.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.waterplane.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // `npm run release:play` passes both: versionCode one past the highest Play has seen,
        // versionName the root package.json version. The defaults are for a plain gradle build.
        versionCode(shellVersionCode)
        versionName(shellVersionName)
        buildConfigField "String", "GIT_SHA", "\"${shellStamp.sha ?: ''}\""
        buildConfigField "boolean", "GIT_DIRTY", "${shellStamp.dirty == true}"
        buildConfigField "long", "BUILT_AT", "${shellStamp.at}L"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        main { assets.srcDir(stampDir) }
    }
    buildFeatures {
        // The flavor's facts below reach Java as BuildConfig fields.
        buildConfig = true
    }
    signingConfigs {
        if (devKey) {
            ownerDev {
                storeFile devKey.storeFile
                storePassword devKey.storePassword
                keyAlias devKey.keyAlias
                keyPassword devKey.keyPassword
            }
        }
        if (playKey) {
            playUpload {
                storeFile playKey.storeFile
                storePassword playKey.storePassword
                keyAlias playKey.keyAlias
                keyPassword playKey.keyPassword
            }
        }
    }
    flavorDimensions = ["distribution"]
    productFlavors {
        dev {
            dimension "distribution"
            // Side by side with a Play install, and on a different key: the two
            // can never update each other, so they must not share an id.
            applicationIdSuffix ".dev"
            buildConfigField "String", "DISTRIBUTION", '"dev"'
            // May install a build of ITSELF (the shell APK updating itself).
            buildConfigField "boolean", "SELF_UPDATE", "true"
            // May ask for USER_ACTION_NOT_REQUIRED and update ownership.
            buildConfigField "boolean", "QUIET_INSTALLS", "true"
        }
        play {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION", '"play"'
            // Play policy: an app from Play is updated only by Play.
            buildConfigField "boolean", "SELF_UPDATE", "false"
            // Play policy: every install of another app goes through the
            // system's confirm dialog — no silent path, no update ownership.
            buildConfigField "boolean", "QUIET_INSTALLS", "false"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Signing per variant, decided in one place: a flavor-level signingConfig loses
// to the debug build type's implicit debug key, so the choice is made here.
// dev (debug AND release) takes the owner's key where it exists — a dev build
// signed one way cannot update one signed the other; play release takes the
// upload key; play debug keeps AGP's default, the debug key.
androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.flavorName == 'dev') {
            // No owner key on this machine: the debug key, release included,
            // so today's flow keeps working on a fresh checkout.
            variant.signingConfig.setConfig(devKey ? android.signingConfigs.ownerDev : android.signingConfigs.debug)
        } else if (variant.flavorName == 'play' && variant.buildType == 'release' && playKey) {
            variant.signingConfig.setConfig(android.signingConfigs.playUpload)
        }
    }
}

// A play release without the upload key must fail HERE, by name — not produce
// an unsigned artifact that fails at upload. Checked when the build runs, so a
// dev build or an IDE sync never trips over it.
tasks.matching { it.name == 'prePlayReleaseBuild' }.configureEach {
    doFirst {
        if (!playKey) {
            throw new GradleException(
                "The play release needs the Play UPLOAD key and none is configured. Put " +
                "storeFile/storePassword/keyAlias/keyPassword in packages/app/android/keystore-play.properties, " +
                "or pass -PplayUploadStoreFile=… with playUploadStorePassword, playUploadKeyAlias and " +
                "playUploadKeyPassword (ORG_GRADLE_PROJECT_… in the environment works too), or set " +
                "PLAY_UPLOAD_STORE_FILE, PLAY_UPLOAD_STORE_PASSWORD, PLAY_UPLOAD_KEY_ALIAS, PLAY_UPLOAD_KEY_PASSWORD. " +
                "See packages/app/README.md, Build.")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // The background link (ShellLinkService).
    //
    // OkHttp for the WebSocket: the platform ships no WebSocket client, and the
    // one property this socket is built around — liveness by PROTOCOL ping
    // rather than a JSON heartbeat, so the host's ws library auto-pongs and the
    // radio wakes twice an hour instead of five times a minute — is one line of
    // OkHttp (`pingInterval`) and a few hundred of hand-rolled RFC 6455.
    //
    // WorkManager for the backstop: it is the only scheduler here that survives
    // process death and a reboot, which is the entire job. Its 15-minute floor
    // is why it is the backstop and not the transport.
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "androidx.work:work-runtime:$workManagerVersion"
    // ShellKeystorePlugin: BiometricPrompt with a CryptoObject (BIOMETRIC_STRONG).
    implementation "androidx.biometric:biometric:1.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
