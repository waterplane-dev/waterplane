# Read by osv-scanner (and so by OpenSSF Scorecard's Vulnerabilities check) for package-lock.json
# next to it. The Android shell's only dependencies are the Capacitor toolchain that runs on the
# dev box; nothing in this lockfile ships in the APK (the APK is the Vite bundle plus Capacitor's
# Java runtime, pinned in android/gradle/verification-metadata.xml, which has its own config).
# Ids, never a blanket package ignore, so a new advisory still surfaces. ignoreUntil makes the list
# come back for review once upstream has had the chance to clear it.

