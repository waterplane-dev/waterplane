<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1096" width="1200" height="1096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>waterplane — component structure</title>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f4f6f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .band { fill: #e8f1fb; stroke: #7aa7d9; stroke-width: 1.2; }
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.3; }
    .ext { fill: #ffffff; stroke: #8250df; stroke-width: 1.5; stroke-dasharray: 7 4; }
    .plug { fill: #fff8ec; stroke: #bc4c00; stroke-width: 1.5; stroke-dasharray: 2 3; }
    .prov { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1; }
    .h { fill: #1f2328; font-size: 15px; font-weight: 700; }
    .t { fill: #1f2328; font-size: 13.5px; font-weight: 650; }
    .s { fill: #424a53; font-size: 11.5px; }
    .k { fill: #0b5cad; font-size: 12.5px; font-weight: 600; }
    .arrow { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .ah { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .band { fill: #0f2540; stroke: #3b6ea8; }
      .box { fill: #0d1117; stroke: #8b949e; }
      .ext { fill: #0d1117; stroke: #a371f7; }
      .plug { fill: #1f1608; stroke: #f0883e; }
      .prov { fill: #161b22; stroke: #6e7681; }
      .h, .t { fill: #e6edf3; }
      .s { fill: #9da7b3; }
      .k { fill: #79c0ff; }
      .arrow { stroke: #8b949e; }
      .ah { fill: #8b949e; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="1096"/>
  <text class="h" x="600" y="40" text-anchor="middle">Inside the code: four packages, and the import rules that hold them apart</text>
  <text class="s" x="600" y="60" text-anchor="middle">Each panel lists its layers top-down. The rule box says what is refused — every rule is an ESLint check that fails the build.</text>
  <rect class="panel" x="20" y="76" width="570" height="568" rx="10"/>
  <text class="h" x="40" y="104">packages/host — the daemon (Node, ESM)</text>
  <rect class="box" x="36" y="118" width="538" height="52" rx="7"/>
  <text class="t" x="50" y="140">main.ts</text>
  <text class="s" x="50" y="158">entry point: env, boot order, listen</text>
  <rect class="box" x="36" y="178" width="538" height="60" rx="7"/>
  <text class="t" x="50" y="200">server/</text>
  <text class="s" x="50" y="220">ServerCtx factories: http, wsops, clients, deliveries, scan, shutdown</text>
  <rect class="box" x="36" y="246" width="538" height="60" rx="7"/>
  <text class="t" x="50" y="268">routes/ + api.ts</text>
  <text class="s" x="50" y="288">the client-message table (session, work, system) and the HTTP routes</text>
  <rect class="box" x="36" y="314" width="538" height="112" rx="7"/>
  <text class="t" x="50" y="336">facades and their slices</text>
  <rect class="box" x="48" y="346" width="256" height="72" rx="7"/>
  <text class="t" x="62" y="366">sessions.ts → sessions/</text>
  <text class="s" x="62" y="384">core.ts (SessionCore) is the hub:</text>
  <text class="s" x="62" y="400">boxes, drive, turn, tmux, sidechannel</text>
  <rect class="box" x="312" y="346" width="252" height="72" rx="7"/>
  <text class="t" x="326" y="366">intents/manager.ts → intents/</text>
  <text class="s" x="326" y="384">contract.ts (IntentCore) is the hub:</text>
  <text class="s" x="326" y="400">ladder, fire, clock, disk, requeue</text>
  <rect class="box" x="36" y="434" width="538" height="60" rx="7"/>
  <text class="t" x="50" y="456">flat modules (~120 files)</text>
  <text class="s" x="50" y="476">deliver, answergate, backlog, files, fanout, ctxlog, tokenstats, prompt, limit</text>
  <rect class="box" x="36" y="502" width="538" height="76" rx="7"/>
  <text class="t" x="50" y="524">leaves</text>
  <text class="s" x="50" y="544">backends/ — types, registry, claude, claude-local, readers</text>
  <text class="s" x="50" y="561">plugins/ — loader, registry, api, rpc, builtin   ·   capture/, cli/</text>
  <rect class="band" x="36" y="586" width="538" height="48" rx="7"/>
  <text class="k" x="50" y="606">local/host-boundary: nothing imports server/ or main; only a facade imports its</text>
  <text class="s" x="50" y="624">slices; slices meet only through core.ts; backends/ and capture/ import no sessions.</text>
  <rect class="panel" x="610" y="76" width="570" height="568" rx="10"/>
  <text class="h" x="630" y="104">packages/web — the phone (React 18 PWA)</text>
  <rect class="box" x="626" y="118" width="538" height="52" rx="7"/>
  <text class="t" x="640" y="140">App.tsx</text>
  <text class="s" x="640" y="158">imports only a feature's index.ts</text>
  <rect class="box" x="626" y="178" width="538" height="76" rx="7"/>
  <text class="t" x="640" y="200">core/ — App's side of the contract</text>
  <text class="s" x="640" y="220">runners: dispatch, sheets, extensionPoints, ExtBoundary, pluginCall</text>
  <text class="s" x="640" y="237">one of each: conn/ (the socket), queue/, send/, term/, route/, sessions/</text>
  <rect class="box" x="626" y="262" width="538" height="60" rx="7"/>
  <text class="t" x="640" y="284">sdk/ = @waterplane/sdk — the one import a feature needs</text>
  <text class="s" x="640" y="304">CoreApi, FeatureManifest, createStore, hooks, ledgers, pluginClient</text>
  <rect class="box" x="626" y="330" width="538" height="76" rx="7"/>
  <text class="t" x="640" y="352">features/&lt;name&gt;/ (~31)</text>
  <text class="s" x="640" y="372">backlog, build, capture, context, fanout, queue, setup, tokens, pull …</text>
  <text class="s" x="640" y="389">each: index.ts (its manifest), store, actions, logic, README</text>
  <rect class="box" x="626" y="414" width="538" height="60" rx="7"/>
  <text class="t" x="640" y="436">kit/ = @waterplane/kit</text>
  <text class="s" x="640" y="456">chips, FilterBar, SearchBox, chart/ (statsPlot, TokenComposition)</text>
  <rect class="box" x="626" y="482" width="538" height="96" rx="7"/>
  <text class="t" x="640" y="504">flat modules (~250 files)</text>
  <text class="s" x="640" y="524">Sheet, Terminal, PromptComposer, Markdown, download, format …</text>
  <text class="s" x="640" y="541">ws, outbox, routing: reached only through core(), never imported</text>
  <text class="s" x="640" y="558">packages/app (Capacitor) wraps this built bundle in the APK</text>
  <rect class="band" x="626" y="586" width="538" height="48" rx="7"/>
  <text class="k" x="640" y="606">local/feature-boundary: a feature imports its own folder and the sdk</text>
  <text class="s" x="640" y="624">index — never another feature, never core/.  local/no-second-socket: one socket.</text>
  <rect class="panel" x="20" y="700" width="1160" height="186" rx="10"/>
  <text class="h" x="40" y="728"></text>
  <text class="h" x="40" y="726">packages/extensions/&lt;id&gt; — features built as plugins, shipped inside waterplane</text>
  <rect class="ext" x="36" y="736" width="360" height="84" rx="7"/>
  <text class="t" x="50" y="758">requirements</text>
  <text class="s" x="50" y="778">host/ + shared/ + web/  ·  built in, always on</text>
  <text class="s" x="50" y="795">the setup row, its fix, the requirements sheet</text>
  <rect class="ext" x="420" y="736" width="360" height="84" rx="7"/>
  <text class="t" x="434" y="758">opencode</text>
  <text class="s" x="434" y="778">host/ only  ·  optional, experimental</text>
  <text class="s" x="434" y="795">the opencode backend through api.backend()</text>
  <rect class="ext" x="804" y="736" width="360" height="84" rx="7"/>
  <text class="t" x="818" y="758">token-stats</text>
  <text class="s" x="818" y="778">web/ only  ·  built in</text>
  <text class="s" x="818" y="795">the token statistics screen, reads sdk ledgers</text>
  <text class="k" x="40" y="844">local/extension-boundary: a host half imports only @waterplane/shared and node:* — the daemon arrives as HostPluginApi;</text>
  <text class="s" x="40" y="864">a web half only sdk, kit, shared, react, lucide. Core reaches in through two doors: plugins/builtin.ts and features/registry.ts.</text>
  <rect class="panel" x="20" y="906" width="1160" height="170" rx="10"/>
  <text class="h" x="40" y="934">packages/shared = @waterplane/shared — pure (no I/O), built first, imported by everything above</text>
  <rect class="box" x="36" y="948" width="360" height="112" rx="7"/>
  <text class="t" x="50" y="970">wire/ — every DTO</text>
  <text class="s" x="50" y="990">messages, session, work, intent,</text>
  <text class="s" x="50" y="1007">transcript, backend, octokens, notify …</text>
  <text class="s" x="50" y="1024">so host and phone cannot disagree on a shape</text>
  <rect class="box" x="420" y="948" width="360" height="112" rx="7"/>
  <text class="t" x="434" y="970">logic both ends must word alike</text>
  <text class="s" x="434" y="990">queue (ackIds), intent, schedule,</text>
  <text class="s" x="434" y="1007">tokens, budget, ctxwindow, sessioncost,</text>
  <text class="s" x="434" y="1024">pricing, settings</text>
  <rect class="box" x="804" y="948" width="360" height="112" rx="7"/>
  <text class="t" x="818" y="970">plugin contracts</text>
  <text class="s" x="818" y="990">plugin.ts — manifest, HostPluginApi,</text>
  <text class="s" x="818" y="1007">and PLUGIN_API_VERSION</text>
  <text class="s" x="818" y="1024">backendsources.ts — turns, dialogs,</text>
  <text class="s" x="818" y="1041">delivery, transcript, context, tokens</text>
  <line class="arrow" x1="170" y1="698" x2="170" y2="646" marker-end="url(#a)"/>
  <line class="arrow" x1="520" y1="698" x2="520" y2="646" marker-end="url(#a)"/>
  <line class="arrow" x1="990" y1="698" x2="990" y2="646" marker-end="url(#a)"/>
  <text class="s" x="180" y="668">host halves → plugins/builtin.ts</text>
  <text class="s" x="980" y="668" text-anchor="end">web halves → features/registry.ts</text>
</svg>

