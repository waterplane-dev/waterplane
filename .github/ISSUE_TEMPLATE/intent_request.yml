name: Intent request
description: Ask for something this project should do. Describe the problem and the end state; the owner builds it.
title: "Intent: "
labels: ["intent-request"]
body:
  - type: markdown
    attributes:
      value: |
        This project is open source, not open contribution: features are not merged
        from outside code. You describe **what should be true and why**; if the request
        is accepted, the owner builds it and credits you with a `Requested-by:` trailer
        and a CHANGELOG mention. See
        [CONTRIBUTING.md](https://github.com/waterplane-dev/waterplane/blob/main/CONTRIBUTING.md).

        **Before filling this in, run the `feature-request` skill** in a clone of this
        repo (start `claude` there and ask it to draft a feature request). It interviews
        you, checks the idea against the project's rules and existing requirements, and
        writes every field below. It runs on your machine with your own tokens.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What hurts, in what situation, how often? What do you do today instead?
    validations:
      required: true

  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: What should be true afterwards, from the person's side. Behaviour, not implementation.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 2–6 observable, testable statements.
      placeholder: |
        - Given …, when …, then …
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What this request deliberately does not cover.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Host — sessions & delivery
        - Host — scheduled & background work
        - Host — model calls of its own
        - Host — token & cost ledgers
        - Host — files, builds & machine
        - Phone — app frame & navigation
        - Phone — sending prompts
        - Phone — terminal & reader
        - Phone — backlog & work sheets
        - Phone — files & downloads
        - Phone — settings, models & sign-in
        - Phone — token & cost screens
        - Wire protocol / shared logic
        - Screen heuristics
        - Android shell
        - Plugins
        - Docs / install
        - Not sure
    validations:
      required: true

  - type: input
    id: requirements
    attributes:
      label: Related requirement IDs
      description: IDs from docs/requirements/ this duplicates, extends or conflicts with (e.g. R-ui-012), or "none found".
    validations:
      required: true

  - type: textarea
    id: verdict
    attributes:
      label: Feasibility verdict
      description: Paste the verdict block the feature-request skill printed, unedited.
      render: text
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      description: As estimated by the skill.
      options:
        - S
        - M
        - L
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example implementation (illustration only)
      description: |
        Optional. A short sketch to make the intent concrete. It is read, never pasted
        or run — the build is written fresh.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran the feature-request skill and pasted its verdict above
          required: true
        - label: I searched existing issues for duplicates
          required: true
